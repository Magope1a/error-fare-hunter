name: Find Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  find-chat-id:
    runs-on: ubuntu-latest

    steps:
      - name: Chat ID ermitteln
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          RESPONSE=$(curl -s \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")

          echo "$RESPONSE" | python -c '
          import json, sys

          data = json.load(sys.stdin)

          if not data.get("ok"):
              print("Telegram API Fehler.")
              sys.exit(1)

          updates = data.get("result", [])

          if not updates:
              print("Keine Nachricht gefunden. Bitte zuerst /start an deinen Bot schicken.")
              sys.exit(1)

          found = set()

          for update in updates:
              message = update.get("message", {})
              chat = message.get("chat", {})

              if chat.get("id") is not None:
                  found.add(str(chat["id"]))

          if not found:
              print("Keine private Chat-ID gefunden.")
              sys.exit(1)

          print("Gefundene Chat-ID(s):")
          for chat_id in found:
              print(chat_id)
          '
