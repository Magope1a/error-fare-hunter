name: Error Fare Hunter

on:
 workflow_dispatch:
  inputs:
    test_latest:
      description: "Aktuelle Beiträge testen"
      required: false
      default: "0"
      type: choice
      options:
        - "0"
        - "1"

    test_telegram:
      description: "Telegram-Verbindung testen"
      required: false
      default: "0"
      type: choice
      options:
        - "0"
        - "1"
  schedule:
    # Schnellstmöglicher GitHub-Schedule: alle 5 Minuten, leicht versetzt.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: error-fare-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Scanner starten
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_LATEST: ${{ inputs.test_latest || '0' }}
        run: python scanner.py

      - name: Scanner-Status speichern
        run: |
          git config user.name "Error Fare Hunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .errorfare_hunter_state.json
          git diff --cached --quiet || git commit -m "Update Error Fare Hunter state"
          git push
