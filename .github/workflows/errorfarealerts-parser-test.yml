```yaml
name: ErrorFareAlerts Live Scanner V5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: errorfarealerts-live-scanner
  cancel-in-progress: false

jobs:
  scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ErrorFareAlerts Smart Scanner V5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import re
          import os
          import json
          from html import unescape

          URL = "https://t.me/s/errorfarealerts"
          SENT_FILE = ".errorfarealerts_sent"

          # ============================================================
          # TELEGRAM-KANAL ABRUFEN
          # ============================================================

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode(
                  "utf-8",
                  errors="replace"
              )

          print("HTTP OK")
          print("HTML-Länge:", len(html))

          posts = re.findall(
              r'<div class="tgme_widget_message[^>]*data-post="([^"]+)"[^>]*>(.*?)</div>\s*</div>',
              html,
              re.S
          )

          print("Beiträge gefunden:", len(posts))

          # ============================================================
          # REGIONEN
          # ============================================================

          ASIA = [
              "japan", "tokyo", "osaka", "kyoto",
              "south korea", "seoul",
              "china", "beijing", "shanghai",
              "hong kong", "taiwan", "taipei",
              "thailand", "bangkok", "phuket",
              "vietnam", "hanoi", "ho chi minh",
              "singapore", "malaysia", "kuala lumpur",
              "indonesia", "bali", "jakarta",
              "philippines", "manila",
              "india", "mumbai", "delhi",
              "asia"
          ]

          LONG_HAUL = ASIA + [
              "usa", "united states",
              "new york", "los angeles",
              "chicago", "miami", "boston",
              "san francisco",
              "canada", "toronto", "vancouver",
              "australia", "sydney", "melbourne",
              "new zealand",
              "brazil", "argentina",
              "south africa",
              "mexico"
          ]

          PREFERRED = [
              "düsseldorf", "duesseldorf", "dus",
              "köln", "cologne", "cgn",
              "frankfurt", "fra",
              "berlin", "ber",
              "hamburg", "ham",
              "münchen", "munich", "muc",
              "amsterdam", "ams",
              "eindhoven", "ein",
              "brussels", "brüssel", "bru",
              "luxembourg", "lux"
          ]

          SHORT_HAUL = [
              "mallorca", "palma",
              "london", "paris",
              "rome", "madrid",
              "barcelona", "lisbon",
              "vienna", "zurich",
              "basel", "prague",
              "budapest", "amsterdam",
              "brussels", "brüssel"
          ]

          # ============================================================
          # ERROR-FARE-SIGNALE
          # ============================================================

          GENERIC_ERROR_TEXT = [
              "error fares are price errors",
              "our algorithm detects error fares",
              "notifies you immediately",
              "sign up for free now",
              "errorfarealerts.com",
              "errorfarealerts"
          ]

          ERROR_SIGNALS = [
              "error fare",
              "errorfare",
              "mistake fare",
              "mistake-fare",
              "pricing mistake",
              "price error",
              "pricing error",
              "fehlerpreis",
              "preisfehler",
              "price mistake",
              "fare error",
              "mistake pricing"
          ]

          # ============================================================
          # HILFSFUNKTIONEN
          # ============================================================

          def clean_text(content):
              text = re.sub(
                  r'<[^>]+>',
                  ' ',
                  content
              )
              text = unescape(text)
              text = re.sub(
                  r'\s+',
                  ' ',
                  text
              )
              return text.strip()

          def extract_price(text):
              matches = re.findall(
                  r'(?:€|EUR)\s?([\d.,]+)|([\d.,]+)\s?(?:€|EUR)',
                  text,
                  re.I
              )

              prices = []

              for a, b in matches:
                  value = a or b

                  try:
                      if "," in value and "." in value:
                          value = value.replace(
                              ".",
                              ""
                          ).replace(
                              ",",
                              "."
                          )

                      elif "," in value:
                          value = value.replace(
                              ",",
                              "."
                          )

                      elif value.count(".") > 1:
                          value = value.replace(
                              ".",
                              ""
                          )

                      prices.append(
                          float(value)
                      )

                  except Exception:
                      pass

              return min(prices) if prices else None

          def detect_cabin(text):
              t = text.lower()

              if re.search(
                  r'\bfirst class\b|\bfirst-class\b|\bfirst\b',
                  t
              ):
                  return "FIRST"

              if re.search(
                  r'\bbusiness class\b|\bbusiness-class\b|\bbusiness\b',
                  t
              ):
                  return "BUSINESS"

              if re.search(
                  r'\beconomy class\b|\beconomy-class\b|\beconomy\b',
                  t
              ):
                  return "ECONOMY"

              return "UNKNOWN"

          def detect_real_error(text):
              t = text.lower()

              for phrase in GENERIC_ERROR_TEXT:
                  t = t.replace(
                      phrase,
                      " "
                  )

              return any(
                  signal in t
                  for signal in ERROR_SIGNALS
              )

          def extract_deal_url(post_id, text):
              # Originaler Telegram-Post ist immer erreichbar
              # über den Kanal + Post-ID.
              telegram_url = (
                  "https://t.me/" +
                  post_id
              )

              # Falls im Text bereits ein ErrorFareAlerts-Link
              # vorhanden ist, bevorzugen wir diesen.
              match = re.search(
                  r'https?://errorfarealerts\.com/[^\s<>"\]]+',
                  text,
                  re.I
              )

              if match:
                  return match.group(0)

              return telegram_url

          # ============================================================
          # V5 BEWERTUNG
          # ============================================================

          def evaluate(text, price, cabin):

              t = text.lower()

              # Newsletter niemals melden
              if "newsletter" in t:
                  return {
                      "score": 0,
                      "level": "IGNORE",
                      "reasons": ["Newsletter"],
                      "real_error": False
                  }

              asia = any(
                  x in t
                  for x in ASIA
              )

              long_haul = any(
                  x in t
                  for x in LONG_HAUL
              )

              preferred = any(
                  x in t
                  for x in PREFERRED
              )

              short_haul = any(
                  x in t
                  for x in SHORT_HAUL
              )

              real_error = detect_real_error(
                  text
              )

              score = 0
              reasons = []

              # ========================================================
              # 1. EXPLIZITER ERROR-FARE-HINWEIS
              # ========================================================

              if real_error:
                  score += 35
                  reasons.append(
                      "konkreter Error-Fare-Hinweis"
                  )

              # ========================================================
              # 2. FIRST CLASS
              # ========================================================

              if cabin == "FIRST" and price is not None:

                  if asia and price < 900:
                      score += 70
                      reasons.append(
                          "First Asien <900€"
                      )

                  elif long_haul and price < 800:
                      score += 60
                      reasons.append(
                          "Long-Haul First <800€"
                      )

                  elif price < 500:
                      score += 45
                      reasons.append(
                          "First <500€"
                      )

              # ========================================================
              # 3. BUSINESS CLASS
              # ========================================================

              elif cabin == "BUSINESS" and price is not None:

                  # Extrem günstige Business-Tickets
                  # sind grundsätzlich interessant,
                  # auch auf Kurzstrecken.
                  if price < 200:
                      score += 55
                      reasons.append(
                          "Business <200€"
                      )

                  elif price < 250:
                      score += 45
                      reasons.append(
                          "Business <250€"
                      )

                  elif price < 300:
                      score += 30
                      reasons.append(
                          "Business <300€"
                      )

                  # Langstrecke zusätzlich bewerten
                  if asia and price < 500:
                      score += 30
                      reasons.append(
                          "Business Asien <500€"
                      )

                  elif long_haul and price < 500:
                      score += 25
                      reasons.append(
                          "Long-Haul Business <500€"
                      )

                  elif long_haul and price < 650:
                      score += 15
                      reasons.append(
                          "Long-Haul Business <650€"
                      )

              # ========================================================
              # 4. ECONOMY
              # ========================================================

              elif cabin == "ECONOMY" and price is not None:

                  if asia:

                      if price < 200:
                          score += 65
                          reasons.append(
                              "Economy Asien <200€"
                          )

                      elif price < 250:
                          score += 50
                          reasons.append(
                              "Economy Asien <250€"
                          )

                      elif price < 300:
                          score += 35
                          reasons.append(
                              "Economy Asien <300€"
                          )

                      elif price < 400:
                          score += 20
                          reasons.append(
                              "Economy Asien <400€"
                          )

                  elif long_haul:

                      if price < 150:
                          score += 60
                          reasons.append(
                              "Long-Haul Economy <150€"
                          )

                      elif price < 200:
                          score += 50
                          reasons.append(
                              "Long-Haul Economy <200€"
                          )

                      elif price < 250:
                          score += 40
                          reasons.append(
                              "Long-Haul Economy <250€"
                          )

                      elif price < 300:
                          score += 25
                          reasons.append(
                              "Long-Haul Economy <300€"
                          )

              # ========================================================
              # 5. UNKNOWN CABIN
              # ========================================================

              elif price is not None:

                  if asia and price < 250:
                      score += 50
                      reasons.append(
                          "Asien <250€"
                      )

                  elif asia and price < 350:
                      score += 35
                      reasons.append(
                          "Asien <350€"
                      )

                  elif long_haul and price < 200:
                      score += 55
                      reasons.append(
                          "Long-Haul <200€"
                      )

                  elif long_haul and price < 250:
                      score += 45
                      reasons.append(
                          "Long-Haul <250€"
                      )

                  elif long_haul and price < 300:
                      score += 30
                      reasons.append(
                          "Long-Haul <300€"
                      )

              # ========================================================
              # 6. REGIONEN
              # ========================================================

              if asia:
                  score += 10
                  reasons.append(
                      "Asien"
                  )

              if preferred:
                  score += 5
                  reasons.append(
                      "DE/NL/BE/LUX-Abflug"
                  )

              # ========================================================
              # 7. KURZSTRECKE
              # ========================================================

              # Keine pauschale harte Strafe mehr.
              # Besonders Business + Error-Fare darf nicht
              # versehentlich auf 0 fallen.

              if short_haul and not long_haul:

                  if cabin == "ECONOMY":
                      score -= 25
                      reasons.append(
                          "Kurzstrecke Economy abgewertet"
                      )

                  elif cabin == "UNKNOWN":
                      score -= 15
                      reasons.append(
                          "Kurzstrecke abgewertet"
                      )

                  # Business bleibt bewusst ohne
                  # Kurzstrecken-Strafe.

              # ========================================================
              # SCORE BEGRENZEN
              # ========================================================

              score = max(
                  0,
                  min(
                      score,
                      100
                  )
              )

              # ========================================================
              # ALARMSTUFEN
              # ========================================================

              if score >= 85:
                  level = "🚨 SOFORT-ALARM"

              elif score >= 70:
                  level = "🔥 SEHR STARK"

              elif score >= 55:
                  level = "🟡 STARKER KANDIDAT"

              elif score >= 40:
                  level = "🔵 BEOBACHTEN"

              else:
                  level = "❌ IGNORIEREN"

              return {
                  "score": score,
                  "level": level,
                  "reasons": reasons,
                  "real_error": real_error
              }

          # ============================================================
          # GESPEICHERTE IDS LADEN
          # ============================================================

          if os.path.exists(SENT_FILE):

              with open(
                  SENT_FILE,
                  "r",
                  encoding="utf-8"
              ) as f:

                  sent_ids = set(
                      line.strip()
                      for line in f
                      if line.strip()
                  )

          else:
              sent_ids = set()

          print(
              "Bereits gemeldete IDs:",
              len(sent_ids)
          )

          new_sent = set()

          # ============================================================
          # LETZTE POSTS AUSWERTEN
          # ============================================================

          for post_id, content in posts[-20:]:

              text = clean_text(
                  content
              )

              price = extract_price(
                  text
              )

              cabin = detect_cabin(
                  text
              )

              result = evaluate(
                  text,
                  price,
                  cabin
              )

              score = result["score"]
              level = result["level"]
              reasons = result["reasons"]
              real_error = result["real_error"]

              print(
                  "=" * 70
              )

              print(
                  "ID:",
                  post_id
              )

              print(
                  "Preis:",
                  f"{price:.0f} €"
                  if price is not None
                  else "nicht erkannt"
              )

              print(
                  "Kabine:",
                  cabin
              )

              print(
                  "Score:",
                  score
              )

              print(
                  "Stufe:",
                  level
              )

              print(
                  "Error-Fare:",
                  "JA"
                  if real_error
                  else "NEIN"
              )

              print(
                  "Gründe:",
                  ", ".join(reasons)
              )

              # ========================================================
              # TELEGRAM-ALARM
              # ========================================================

              if score >= 70:

                  if post_id in sent_ids:

                      print(
                          "STATUS: Bereits gemeldet – übersprungen."
                      )

                  else:

                      print(
                          "STATUS: 🚨 NEUER RELEVANTER TREFFER"
                      )

                      token = os.environ.get(
                          "TELEGRAM_BOT_TOKEN"
                      )

                      chat_id = os.environ.get(
                          "TELEGRAM_CHAT_ID"
                      )

                      if not token or not chat_id:

                          print(
                              "FEHLER: Telegram-Secrets fehlen."
                          )

                          continue

                      deal_url = extract_deal_url(
                          post_id,
                          text
                      )

                      price_text = (
                          f"{price:.0f} €"
                          if price is not None
                          else "Preis nicht erkannt"
                      )

                      message = (
                          f"🚨 ERROR FARE ALERT\n\n"
                          f"💰 Preis: {price_text}\n"
                          f"💺 Kabine: {cabin}\n"
                          f"📊 Score: {score}/100\n"
                          f"⚠️ Stufe: {level}\n\n"
                          f"🔎 Gründe:\n"
                          f"{chr(10).join('• ' + r for r in reasons)}\n\n"
                          f"🔗 Deal:\n"
                          f"{deal_url}"
                      )

                      api_url = (
                          "https://api.telegram.org/"
                          f"bot{token}/sendMessage"
                      )

                      data = urllib.parse.urlencode({
                          "chat_id": chat_id,
                          "text": message,
                          "disable_web_page_preview": "false"
                      }).encode()

                      telegram_request = urllib.request.Request(
                          api_url,
                          data=data,
                          method="POST"
                      )

                      try:

                          with urllib.request.urlopen(
                              telegram_request,
                              timeout=20
                          ) as response:

                              result_tg = json.loads(
                                  response.read().decode(
                                      "utf-8"
                                  )
                              )

                          if result_tg.get("ok"):

                              print(
                                  "Telegram: erfolgreich gesendet."
                              )

                              new_sent.add(
                                  post_id
                              )

                          else:

                              print(
                                  "Telegram API Fehler:",
                                  result_tg
                              )

                      except Exception as error:

                          print(
                              "Telegram Fehler:",
                              error
                          )

              else:

                  print(
                      "STATUS: kein Telegram-Alarm"
                  )

          # ============================================================
          # IDS SPEICHERN
          # ============================================================

          sent_ids.update(
              new_sent
          )

          # Maximal 500 IDs behalten
          sent_ids = set(
              list(sent_ids)[-500:]
          )

          with open(
              SENT_FILE,
              "w",
              encoding="utf-8"
          ) as f:

              for post_id in sorted(
                  sent_ids
              ):
                  f.write(
                      post_id + "\n"
                  )

          print()
          print(
              "=" * 70
          )

          print(
              "Neue Telegram-Meldungen:",
              len(new_sent)
          )

          print(
              "Gespeicherte IDs:",
              len(sent_ids)
          )

          print(
              "LIVE-SCANNER V5 ABGESCHLOSSEN"
          )

          PY

      - name: Gesendete IDs speichern
        run: |
          git config user.name "ErrorFareAlerts Bot"
          git config user.email "actions@github.com"

          git add .errorfarealerts_sent

          git diff --cached --quiet || \
            git commit -m "Update ErrorFareAlerts sent IDs"

          git push
```
