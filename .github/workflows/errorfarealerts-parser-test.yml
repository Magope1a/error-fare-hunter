name: ErrorFareAlerts Smart Parser V2

on:
  workflow_dispatch:

jobs:
  parser-test:
    runs-on: ubuntu-latest

    steps:
      - name: Smart Parser V2
        run: |
          python - <<'PY'
          import urllib.request
          import re
          from html import unescape

          URL = "https://t.me/s/errorfarealerts"

          request = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          print("HTTP OK")
          print("HTML-Länge:", len(html))

          posts = re.findall(
              r'<div class="tgme_widget_message[^>]*data-post="([^"]+)"[^>]*>(.*?)</div>\s*</div>',
              html,
              re.S
          )

          print("Beiträge gefunden:", len(posts))
          print()

          ASIA = [
              "japan", "tokyo", "osaka", "kyoto",
              "south korea", "seoul",
              "china", "beijing", "shanghai",
              "hong kong", "taiwan", "taipei",
              "thailand", "bangkok", "phuket",
              "vietnam", "hanoi", "ho chi minh",
              "singapore", "malaysia", "kuala lumpur",
              "indonesia", "bali", "jakarta",
              "philippines", "manila",
              "india", "mumbai", "delhi",
              "asia"
          ]

          LONG_HAUL = [
              "japan", "tokyo", "osaka", "kyoto",
              "south korea", "seoul",
              "china", "beijing", "shanghai",
              "hong kong", "taiwan", "taipei",
              "thailand", "bangkok", "phuket",
              "vietnam", "hanoi", "ho chi minh",
              "singapore", "malaysia",
              "indonesia", "bali",
              "philippines", "manila",
              "india", "mumbai", "delhi",
              "usa", "new york", "los angeles",
              "chicago", "miami", "canada",
              "australia", "sydney", "melbourne",
              "new zealand", "brazil",
              "argentina", "south africa"
          ]

          PREFERRED = [
              "düsseldorf", "duesseldorf", "dus",
              "köln", "cologne", "cgn",
              "frankfurt", "fra",
              "berlin", "ber",
              "hamburg", "ham",
              "münchen", "munich", "muc",
              "amsterdam", "ams",
              "eindhoven", "ein",
              "brussels", "brüssel", "bru",
              "luxembourg", "lux"
          ]

          SHORT_HAUL = [
              "mallorca", "palma",
              "london", "paris",
              "rome", "madrid",
              "barcelona", "lisbon",
              "vienna", "zurich",
              "basel", "prague",
              "budapest", "amsterdam",
              "brussels", "brüssel"
          ]

          def clean_text(content):
              text = re.sub(r'<[^>]+>', ' ', content)
              text = unescape(text)
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          def extract_price(text):
              matches = re.findall(
                  r'(?:€|EUR)\s?([\d.,]+)|([\d.,]+)\s?(?:€|EUR)',
                  text,
                  re.I
              )

              prices = []

              for a, b in matches:
                  value = a or b

                  try:
                      if "," in value and "." in value:
                          value = value.replace(".", "").replace(",", ".")
                      elif "," in value:
                          value = value.replace(",", ".")
                      elif value.count(".") > 1:
                          value = value.replace(".", "")

                      prices.append(float(value))
                  except:
                      pass

              return min(prices) if prices else None

          def detect_cabin(text):
              t = text.lower()

              if re.search(r'\bfirst class\b|\bfirst-class\b', t):
                  return "FIRST"

              if re.search(r'\bbusiness class\b|\bbusiness-class\b', t):
                  return "BUSINESS"

              if re.search(r'\beconomy class\b|\beconomy-class\b|\beconomy\b', t):
                  return "ECONOMY"

              return "UNKNOWN"

          def actual_error_signal(text):
              """
              Nur nach konkreten Error-Fare-Hinweisen suchen.
              Den allgemeinen Website-Satz 'Error Fares are price errors...'
              NICHT berücksichtigen.
              """

              t = text.lower()

              # Allgemeiner EFA-Erklärungstext entfernen
              generic = [
                  "error fares are price errors in travel deals",
                  "our algorithm detects error fares",
                  "notifies you immediately",
                  "sign up for free now"
              ]

              for phrase in generic:
                  t = t.replace(phrase, "")

              signals = [
                  "error fare",
                  "errorfare",
                  "mistake fare",
                  "mistake",
                  "pricing mistake",
                  "price error",
                  "fehlerpreis",
                  "preisfehler"
              ]

              return any(signal in t for signal in signals)

          def score_deal(text, price, cabin):

              t = text.lower()

              asia = any(x in t for x in ASIA)
              long_haul = any(x in t for x in LONG_HAUL)
              preferred = any(x in t for x in PREFERRED)
              short_haul = any(x in t for x in SHORT_HAUL)
              explicit_error = actual_error_signal(text)

              score = 0
              reasons = []

              # Newsletter niemals bewerten
              if "newsletter" in t:
                  return 0, ["Newsletter"], "IGNORE"

              # ------------------------------------------------
              # EXTREM NIEDRIGER PREIS
              # ------------------------------------------------

              if price is not None:

                  if cabin == "BUSINESS":

                      if asia:
                          if price < 400:
                              score += 60
                              reasons.append("Business Asien <400€")
                          elif price < 500:
                              score += 50
                              reasons.append("Business Asien <500€")
                          elif price < 650:
                              score += 38
                              reasons.append("Business Asien <650€")
                          elif price < 800:
                              score += 25
                              reasons.append("Business Asien <800€")

                      elif long_haul:
                          if price < 400:
                              score += 55
                              reasons.append("Long-Haul Business <400€")
                          elif price < 500:
                              score += 45
                              reasons.append("Long-Haul Business <500€")
                          elif price < 650:
                              score += 30
                              reasons.append("Long-Haul Business <650€")

                      elif short_haul:
                          if price < 150:
                              score += 15
                              reasons.append("extrem günstige Kurzstrecke")

                      else:
                          if price < 300:
                              score += 25

                  elif cabin == "FIRST":

                      if asia and price < 900:
                          score += 65
                          reasons.append("First Asien <900€")
                      elif long_haul and price < 800:
                          score += 55
                          reasons.append("Long-Haul First <800€")
                      elif price < 500:
                          score += 45

                  elif cabin == "ECONOMY":

                      if asia:
                          if price < 150:
                              score += 60
                              reasons.append("Economy Asien <150€")
                          elif price < 200:
                              score += 50
                              reasons.append("Economy Asien <200€")
                          elif price < 250:
                              score += 40
                              reasons.append("Economy Asien <250€")
                          elif price < 300:
                              score += 30
                              reasons.append("Economy Asien <300€")
                          elif price < 400:
                              score += 15

                      elif long_haul:
                          if price < 150:
                              score += 50
                              reasons.append("Long-Haul Economy <150€")
                          elif price < 200:
                              score += 40
                              reasons.append("Long-Haul Economy <200€")
                          elif price < 250:
                              score += 30
                              reasons.append("Long-Haul Economy <250€")
                          elif price < 300:
                              score += 20

                      elif short_haul:
                          # Mallorca/London/etc. nicht als Error-Fare pushen
                          if price < 40:
                              score += 10

                  else:
                      # unbekannte Kabine
                      if long_haul and price < 200:
                          score += 25

              # ------------------------------------------------
              # ASIEN
              # ------------------------------------------------

              if asia:
                  score += 15
                  reasons.append("Asien")

              # ------------------------------------------------
              # BEVORZUGTER ABFLUG
              # ------------------------------------------------

              if preferred:
                  score += 5
                  reasons.append("DE/NL/BE/LUX-Abflug")

              # ------------------------------------------------
              # KONKRETER ERROR-FARE-HINWEIS
              # ------------------------------------------------

              if explicit_error:
                  score += 25
                  reasons.append("konkreter Error-Fare-Hinweis")

              # ------------------------------------------------
              # NORMALE KURZSTRECKE EXTRA DÄMPFEN
              # ------------------------------------------------

              if short_haul and not long_haul:
                  score -= 20

              score = max(0, min(score, 100))

              # ------------------------------------------------
              # KLASSIFIZIERUNG
              # ------------------------------------------------

              if score >= 85:
                  classification = "🚨 EXTREMER ERROR FARE"
              elif score >= 70:
                  classification = "🔥 SEHR STARK"
              elif score >= 55:
                  classification = "🟡 STARKER DEAL"
              elif score >= 40:
                  classification = "🔵 INTERESSANT"
              else:
                  classification = "❌ IGNORIEREN"

              return score, reasons, classification

          # ----------------------------------------------------
          # TEST
          # ----------------------------------------------------

          for number, (post_id, content) in enumerate(posts[-15:], 1):

              text = clean_text(content)

              price = extract_price(text)
              cabin = detect_cabin(text)

              score, reasons, classification = score_deal(
                  text, price, cabin
              )

              print("=" * 80)
              print(f"POST {number}")
              print("ID:", post_id)
              print(
                  "Preis:",
                  f"{price:.0f} €" if price is not None else "nicht erkannt"
              )
              print("Kabine:", cabin)
              print("Score:", score)
              print("Gründe:", ", ".join(reasons))
              print("KLASSIFIZIERUNG:", classification)
              print("TEXT:", text[:700])
              print()

          print("=" * 80)
          print("SMART-PARSER V2 TEST ABGESCHLOSSEN")
          PY
