name: ErrorFareAlerts Live Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  scanner:
    runs-on: ubuntu-latest

    steps:
      - name: ErrorFareAlerts Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import urllib.request
          import urllib.parse
          import re
          import os
          import json
          from html import unescape

          URL = "https://t.me/s/errorfarealerts"

          request = urllib.request.Request(
              URL,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              html = response.read().decode("utf-8", errors="replace")

          print("HTTP OK")
          print("HTML-Länge:", len(html))

          posts = re.findall(
              r'<div class="tgme_widget_message[^>]*data-post="([^"]+)"[^>]*>(.*?)</div>\s*</div>',
              html,
              re.S
          )

          print("Beiträge gefunden:", len(posts))

          ASIA = [
              "japan", "tokyo", "osaka", "kyoto",
              "south korea", "seoul",
              "china", "beijing", "shanghai",
              "hong kong", "taiwan", "taipei",
              "thailand", "bangkok", "phuket",
              "vietnam", "hanoi", "ho chi minh",
              "singapore", "malaysia", "kuala lumpur",
              "indonesia", "bali", "jakarta",
              "philippines", "manila",
              "india", "mumbai", "delhi",
              "asia"
          ]

          LONG_HAUL = ASIA + [
              "usa", "new york", "los angeles",
              "chicago", "miami", "canada",
              "australia", "sydney", "melbourne",
              "new zealand", "brazil",
              "argentina", "south africa"
          ]

          PREFERRED = [
              "düsseldorf", "duesseldorf", "dus",
              "köln", "cologne", "cgn",
              "frankfurt", "fra",
              "berlin", "ber",
              "hamburg", "ham",
              "münchen", "munich", "muc",
              "amsterdam", "ams",
              "eindhoven", "ein",
              "brussels", "brüssel", "bru",
              "luxembourg", "lux"
          ]

          SHORT_HAUL = [
              "mallorca", "palma",
              "london", "paris", "rome", "madrid",
              "barcelona", "lisbon", "vienna",
              "zurich", "basel", "prague",
              "budapest", "amsterdam",
              "brussels", "brüssel"
          ]

          GENERIC_ERROR_TEXT = [
              "error fares are price errors",
              "our algorithm detects error fares",
              "notifies you immediately",
              "sign up for free now",
              "errorfarealerts.com",
              "errorfarealerts"
          ]

          ERROR_SIGNALS = [
              "error fare",
              "mistake fare",
              "mistake-fare",
              "pricing mistake",
              "price error",
              "pricing error",
              "fehlerpreis",
              "preisfehler",
              "price mistake"
          ]

          STATE_FILE = "/tmp/errorfare_state.json"

          def clean_text(content):
              text = re.sub(r'<[^>]+>', ' ', content)
              text = unescape(text)
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          def extract_price(text):
              matches = re.findall(
                  r'(?:€|EUR)\s?([\d.,]+)|([\d.,]+)\s?(?:€|EUR)',
                  text,
                  re.I
              )

              prices = []

              for a, b in matches:
                  value = a or b

                  try:
                      if "," in value and "." in value:
                          value = value.replace(".", "").replace(",", ".")
                      elif "," in value:
                          value = value.replace(",", ".")
                      elif value.count(".") > 1:
                          value = value.replace(".", "")

                      prices.append(float(value))
                  except:
                      pass

              return min(prices) if prices else None

          def detect_cabin(text):
              t = text.lower()

              if re.search(r'\bfirst class\b|\bfirst-class\b', t):
                  return "FIRST"

              if re.search(r'\bbusiness class\b|\bbusiness-class\b', t):
                  return "BUSINESS"

              if re.search(
                  r'\beconomy class\b|\beconomy-class\b|\beconomy\b',
                  t
              ):
                  return "ECONOMY"

              return "UNKNOWN"

          def detect_real_error(text):
              t = text.lower()

              for phrase in GENERIC_ERROR_TEXT:
                  t = t.replace(phrase, "")

              return any(signal in t for signal in ERROR_SIGNALS)

          def score_deal(text, price, cabin):

              t = text.lower()

              if "newsletter" in t:
                  return 0, ["Newsletter"], "IGNORE"

              asia = any(x in t for x in ASIA)
              long_haul = any(x in t for x in LONG_HAUL)
              preferred = any(x in t for x in PREFERRED)
              short_haul = any(x in t for x in SHORT_HAUL)
              real_error = detect_real_error(text)

              score = 0
              reasons = []

              # ==============================
              # BUSINESS
              # ==============================

              if cabin == "BUSINESS" and price is not None:

                  if asia:
                      if price < 400:
                          score += 70
                          reasons.append("Business Asien <400€")
                      elif price < 500:
                          score += 60
                          reasons.append("Business Asien <500€")
                      elif price < 650:
                          score += 45
                          reasons.append("Business Asien <650€")
                      elif price < 800:
                          score += 30

                  elif long_haul:
                      if price < 400:
                          score += 65
                          reasons.append("Long-Haul Business <400€")
                      elif price < 500:
                          score += 55
                          reasons.append("Long-Haul Business <500€")
                      elif price < 650:
                          score += 40

                  elif short_haul:
                      score += 0

              # ==============================
              # FIRST
              # ==============================

              elif cabin == "FIRST" and price is not None:

                  if asia and price < 900:
                      score += 75
                      reasons.append("First Asien <900€")

                  elif long_haul and price < 800:
                      score += 65
                      reasons.append("Long-Haul First <800€")

                  elif price < 500:
                      score += 50

              # ==============================
              # ECONOMY
              # ==============================

              elif cabin == "ECONOMY" and price is not None:

                  if asia:

                      if price < 150:
                          score += 70
                          reasons.append("Economy Asien <150€")

                      elif price < 200:
                          score += 60
                          reasons.append("Economy Asien <200€")

                      elif price < 250:
                          score += 50
                          reasons.append("Economy Asien <250€")

                      elif price < 300:
                          score += 40
                          reasons.append("Economy Asien <300€")

                      elif price < 400:
                          score += 25
                          reasons.append("Economy Asien <400€")

                      elif price < 450:
                          score += 15

                  elif long_haul:

                      if price < 150:
                          score += 60

                      elif price < 200:
                          score += 50

                      elif price < 250:
                          score += 40

                      elif price < 300:
                          score += 25

                  elif short_haul:

                      # Normale Europa-Kurzstrecken ignorieren
                      score += 0

              # ==============================
              # UNKNOWN CABIN
              # ==============================

              elif price is not None:

                  if long_haul:

                      if price < 200:
                          score += 40
                          reasons.append("Long-Haul sehr günstig")

                      elif price < 300:
                          score += 20

              # ==============================
              # REGION BONUS
              # ==============================

              if asia:
                  score += 15
                  reasons.append("Asien")

              if preferred:
                  score += 5
                  reasons.append("bevorzugter Abflug")

              # ==============================
              # ECHTER ERROR-FARE-HINWEIS
              # ==============================

              if real_error:
                  score += 30
                  reasons.append("Error-Fare-Hinweis")

              # Europa-Kurzstrecken massiv dämpfen
              if short_haul and not long_haul:
                  score -= 25

              score = max(0, min(score, 100))

              # ==============================
              # KLASSIFIZIERUNG
              # ==============================

              if score >= 85:
                  classification = "🚨 EXTREMER ERROR FARE"

              elif score >= 70:
                  classification = "🔥 SEHR STARK"

              elif score >= 55:
                  classification = "🟡 STARKER DEAL"

              elif score >= 40:
                  classification = "🔵 INTERESSANT"

              else:
                  classification = "❌ IGNORIEREN"

              return score, reasons, classification

          def send_telegram(message):

              token = os.environ.get("TELEGRAM_BOT_TOKEN")
              chat_id = os.environ.get("TELEGRAM_CHAT_ID")

              if not token or not chat_id:
                  print("Telegram-Secrets fehlen.")
                  return False

              api_url = (
                  f"https://api.telegram.org/bot{token}/sendMessage"
              )

              data = urllib.parse.urlencode({
                  "chat_id": chat_id,
                  "text": message,
                  "disable_web_page_preview": "false"
              }).encode()

              req = urllib.request.Request(
                  api_url,
                  data=data,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.loads(
                          response.read().decode("utf-8")
                      )

                  if result.get("ok"):
                      print("Telegram: Nachricht erfolgreich gesendet.")
                      return True

                  print("Telegram-Fehler:", result)
                  return False

              except Exception as e:
                  print("Telegram-Verbindungsfehler:", e)
                  return False

          # ==========================================
          # NEUE POSTS AUSWERTEN
          # ==========================================

          # Die letzten 10 Posts reichen für jeden 5-Minuten-Lauf.
          recent_posts = posts[-10:]

          candidates = []

          for post_id, content in recent_posts:

              text = clean_text(content)

              price = extract_price(text)
              cabin = detect_cabin(text)

              score, reasons, classification = score_deal(
                  text, price, cabin
              )

              print("=" * 70)
              print("ID:", post_id)
              print(
                  "Preis:",
                  f"{price:.0f} €" if price is not None else "nicht erkannt"
              )
              print("Kabine:", cabin)
              print("Score:", score)
              print("Klassifizierung:", classification)

              if score >= 70 and classification != "IGNORE":
                  candidates.append(
                      (post_id, text, price, cabin, score, reasons, classification)
                  )

          # ==========================================
          # TELEGRAM
          # ==========================================

          for post_id, text, price, cabin, score, reasons, classification in candidates:

              message = (
                  f"{classification}\n\n"
                  f"💶 Preis: {price:.0f} €\n"
                  f"✈️ Kabine: {cabin}\n"
                  f"🌏 Score: {score}/100\n"
                  f"📍 Gründe: {', '.join(reasons)}\n\n"
                  f"{text[:900]}"
              )

              send_telegram(message)

          print()
          print("=" * 70)
          print("LIVE-SCANNER-LAUF ABGESCHLOSSEN")
          PY
