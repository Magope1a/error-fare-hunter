name: Find Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  find-chat-id:
    runs-on: ubuntu-latest

    steps:
      - name: Telegram Verbindung testen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()

          if not token:
              print("FEHLER: TELEGRAM_BOT_TOKEN ist leer.")
              raise SystemExit(1)

          url = f"https://api.telegram.org/bot{token}/getUpdates"

          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  data = json.loads(response.read().decode())

              if data.get("ok"):
                  print("Telegram-Verbindung erfolgreich.")
                  print(f"Anzahl Updates: {len(data.get('result', []))}")

                  for update in data.get("result", []):
                      chat = update.get("message", {}).get("chat", {})
                      chat_id = chat.get("id")

                      if chat_id:
                          print(f"CHAT_ID: {chat_id}")
              else:
                  print("Telegram hat die Anfrage abgelehnt.")
                  print("Der Bot-Token ist möglicherweise ungültig.")
                  raise SystemExit(1)

          except Exception as e:
              print(f"Verbindungsfehler: {type(e).__name__}")
              print("Der Secret-Wert konnte nicht erfolgreich verwendet werden.")
              raise SystemExit(1)
          PY
